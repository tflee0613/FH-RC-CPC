[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fh-rc-cpc"
version = "3.0.0"
description = "Code accompanying minimum-cost retention of MPC policy portfolios"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Tengfei Li"},
  {name = "Zhuang Shao"},
  {name = "GuangTao Zhang"},
  {name = "Liang Zheng"},
  {name = "Wenxuan Dong"},
  {name = "Shaojie Xu"},
  {name = "Xubin Xu"},
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fh-rc-cpc-response = "fh_rc_cpc.response_query.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["fh_rc_cpc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "examples", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
